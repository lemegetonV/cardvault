name: api-tests

# Runs the pytest API suite (tests/api) against a full CardVault stack started in the runner.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: api-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Start CardVault
        uses: ./.github/actions/start-stack

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install the test libraries
        working-directory: tests/api
        run: pip install -r requirements.txt

      - name: Run the tests
        working-directory: tests/api
        run: pytest -n 4 --html=reports/report.html --self-contained-html --junitxml=reports/junit.xml --alluredir=reports/allure-results

      - name: Run a short load test (Locust)
        working-directory: tests/perf
        run: |
          pip install -r requirements.txt
          locust --headless --users 10 --spawn-rate 5 --run-time 30s --only-summary --html ../api/reports/load-test.html

      - name: Set up Node.js (for the Allure report tool)
        if: always()
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build the Allure report
        if: always()
        working-directory: tests/api
        run: npx --yes allure@3.33.0 generate reports/allure-results --output reports/allure-report

      - name: Save the CardVault logs
        if: always()
        run: |
          mkdir -p tests/api/reports
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color --timestamps > tests/api/reports/cardvault-logs.txt 2>&1 || true

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: api-test-report
          path: tests/api/reports/
          retention-days: 14

      - name: Stop CardVault
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
